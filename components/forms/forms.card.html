<!-- @dsCard group="Components" viewport="700x320" name="Form controls" subtitle="Input · Select · Switch — mono labels, accent focus" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; }
  .wrap { background: var(--uil-water); padding: 26px 28px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 20px; align-items: start; }
  .span { grid-column: 1 / -1; }
</style>
</head>
<body class="uil-water">
  <div class="wrap"><div id="root"></div></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    const { Input, Select, Switch } = window.UiLabDesignSystem_b96795;
    function Demo() {
      const [on, setOn] = React.useState(true);
      const [n, setN] = React.useState(false);
      return (
        <div className="grid">
          <Input label="Name" placeholder="Stefan Martin" />
          <Input label="Email" type="email" placeholder="you@firm.com.au" hint="We only email about Logan events." />
          <Select label="Vertical" options={[
            {value:'community',label:'Community'},
            {value:'connect',label:'Connect'},
            {value:'events',label:'Events'},
            {value:'industry',label:'Industry'},
          ]} />
          <Input label="Postcode" defaultValue="4127" error="Enter a valid QLD postcode." />
          <div className="span" style={{display:'flex',flexDirection:'column',gap:12,marginTop:4}}>
            <Switch checked={on} onChange={setOn} label="Notify me about UiLab events" />
            <Switch checked={n} onChange={setN} label="Subscribe to the podcast" />
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
  </script>
</body>
</html>
