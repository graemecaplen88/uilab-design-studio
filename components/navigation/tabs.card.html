<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; }
  .wrap { background: var(--uil-water); padding: 28px 30px; }
  .panel { font-family: var(--font-display); font-size: 15px; color: rgba(255,255,255,.72); margin-top: 22px; }
</style>
</head>
<body class="uil-water">
  <div class="wrap"><div id="root"></div></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    const { Tabs } = window.UiLabDesignSystem_b96795;
    const copy = {
      community: 'A place for Logan to grow and succeed.',
      connect: 'Linking people, systems and creativity.',
      events: 'Workshops, lunches and development days across Logan.',
      industry: 'Where local firms meet emerging technology.',
    };
    function Demo() {
      const [tab, setTab] = React.useState('events');
      return (
        <div>
          <Tabs value={tab} onChange={setTab} items={[
            {value:'community',label:'Community'},
            {value:'connect',label:'Connect'},
            {value:'events',label:'Events',count:6},
            {value:'industry',label:'Industry'},
          ]} />
          <div className="panel">{copy[tab]}</div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
  </script>
</body>
</html>
