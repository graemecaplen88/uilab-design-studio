<!-- @dsCard group="Colors" viewport="700x190" name="Dark grounds" subtitle="Backgrounds are always the darker tone" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; }
  .wrap { background: #0a0a0a; padding: 24px; font-family: var(--font-mono); }
  .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .sw { border-radius: var(--radius-sm); overflow: hidden; border: 1px solid rgba(255,255,255,.1); }
  .chip { height: 84px; }
  .meta { padding: 8px 10px; background: #141414; }
  .nm { color: #fff; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .12em; }
  .hx { color: #8a8a8a; font-size: 11px; margin-top: 3px; letter-spacing: .04em; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="row">
      <div class="sw"><div class="chip" style="background:var(--uil-sunset)"></div><div class="meta"><div class="nm">Sunset</div><div class="hx">#4C0027</div></div></div>
      <div class="sw"><div class="chip" style="background:var(--uil-water)"></div><div class="meta"><div class="nm">Water</div><div class="hx">#013053</div></div></div>
      <div class="sw"><div class="chip" style="background:var(--uil-earth)"></div><div class="meta"><div class="nm">Earth</div><div class="hx">#421C01</div></div></div>
      <div class="sw"><div class="chip" style="background:var(--uil-land)"></div><div class="meta"><div class="nm">Land</div><div class="hx">#025120</div></div></div>
      <div class="sw"><div class="chip" style="background:var(--uil-black)"></div><div class="meta"><div class="nm">Black</div><div class="hx">#000000</div></div></div>
    </div>
  </div>
</body>
</html>
