<!-- @dsCard group="Brand" viewport="700x260" name="Logan Divisions" subtitle="Council-boundary silhouettes — motifs, framing & image masks" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; }
  .wrap { background: var(--uil-sunset); padding: 26px 30px; display: grid; grid-template-columns: 1.05fr 1fr; gap: 20px; align-items: center; }
  .maps { display: flex; gap: 16px; align-items: center; justify-content: center; }
  .maps img { display: block; }
  .m-div { width: 200px; }
  .m-one { width: 124px; opacity: .5; }
  .lab { font-family: var(--font-mono); font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: .14em; color: var(--uil-summer); }
  .h { font-family: var(--font-display); font-weight: 700; font-size: 36px; line-height: 1; letter-spacing: -.02em; color: var(--uil-summer); margin-top: 12px; }
  .p { font-family: var(--font-display); font-size: 14px; line-height: 1.5; color: color-mix(in srgb, var(--uil-summer) 78%, var(--uil-sunset)); margin-top: 10px; max-width: 34ch; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="maps">
      <img class="m-div" src="../assets/graphics/logan-divisions-summer.png" alt="Logan divisions silhouettes">
      <img class="m-one" src="../assets/graphics/logan-summer.png" alt="Logan boundary">
    </div>
    <div>
      <div class="lab">Graphic Assets / 04</div>
      <div class="h">Here for Logan.</div>
      <div class="p">Every council division has a place in the system — many parts contributing to one whole.</div>
    </div>
  </div>
</body>
</html>
