<!-- @dsCard group="Spacing" viewport="700x170" name="Spacing scale — 4pt" subtitle="Modular spacing on a 4pt base" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; }
  .wrap { background: var(--uil-water); padding: 24px 30px; }
  .row { display: flex; align-items: flex-end; gap: 16px; }
  .item { display: flex; flex-direction: column; gap: 7px; align-items: flex-start; }
  .bar { background: var(--uil-sun); border-radius: 2px; height: 22px; }
  .lab { font-family: var(--font-mono); font-weight: 700; font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: #fff; }
  .px { font-family: var(--font-mono); font-size: 10px; color: rgba(255,255,255,.5); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="row">
      <div class="item"><div class="bar" style="width:var(--space-1)"></div><div class="lab">1</div><div class="px">4</div></div>
      <div class="item"><div class="bar" style="width:var(--space-2)"></div><div class="lab">2</div><div class="px">8</div></div>
      <div class="item"><div class="bar" style="width:var(--space-3)"></div><div class="lab">3</div><div class="px">12</div></div>
      <div class="item"><div class="bar" style="width:var(--space-4)"></div><div class="lab">4</div><div class="px">16</div></div>
      <div class="item"><div class="bar" style="width:var(--space-5)"></div><div class="lab">5</div><div class="px">24</div></div>
      <div class="item"><div class="bar" style="width:var(--space-6)"></div><div class="lab">6</div><div class="px">32</div></div>
      <div class="item"><div class="bar" style="width:var(--space-7)"></div><div class="lab">7</div><div class="px">48</div></div>
      <div class="item"><div class="bar" style="width:var(--space-8)"></div><div class="lab">8</div><div class="px">64</div></div>
    </div>
  </div>
</body>
</html>
