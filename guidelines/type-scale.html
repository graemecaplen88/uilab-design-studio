<!-- @dsCard group="Type" viewport="700x300" name="Type scale" subtitle="Display → body, paired with mono labels" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; }
  .wrap { background: var(--uil-water); color: var(--uil-white); padding: 26px 30px; }
  .r { display: grid; grid-template-columns: 92px 1fr; align-items: baseline; gap: 18px; padding: 9px 0; border-bottom: 1px solid var(--border); }
  .r:last-child { border-bottom: 0; }
  .k { font-family: var(--font-mono); font-weight: 700; font-size: 10px; text-transform: uppercase; letter-spacing: .12em; color: var(--uil-sun); }
  .d { font-family: var(--font-display); color: #fff; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="r"><div class="k">Display</div><div class="d" style="font-weight:700;font-size:44px;line-height:1;letter-spacing:-.03em">Here for Logan</div></div>
    <div class="r"><div class="k">H1 · Bold</div><div class="d" style="font-weight:700;font-size:32px;letter-spacing:-.02em">Developing local talent</div></div>
    <div class="r"><div class="k">H2 · Reg</div><div class="d" style="font-weight:400;font-size:25px;letter-spacing:-.02em">A place to grow and succeed</div></div>
    <div class="r"><div class="k">H3 · Med</div><div class="d" style="font-weight:500;font-size:19px">Emerging technology over lunch</div></div>
    <div class="r"><div class="k">Body</div><div class="d" style="font-weight:400;font-size:16px;line-height:1.5;color:rgba(255,255,255,.72)">UiLab connects Logan's people, systems and creativity — turning new technology into local outcomes.</div></div>
  </div>
</body>
</html>
