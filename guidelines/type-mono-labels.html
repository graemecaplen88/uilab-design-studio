<!-- @dsCard group="Type" viewport="700x250" name="Mono labels — Roboto Mono" subtitle="Bold UPPERCASE · wide tracking · eyebrows, tags, metadata" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; }
  .wrap { background: var(--uil-water); color: var(--uil-white); padding: 28px 30px; }
  .aa { font-family: var(--font-mono); font-weight: 700; font-size: 78px; line-height: .9; color: var(--uil-sun); }
  .stack { margin-top: 18px; display: flex; flex-direction: column; gap: 12px; }
  .l { font-family: var(--font-mono); font-weight: 700; text-transform: uppercase; }
  .eyebrow { font-size: 13px; letter-spacing: .16em; color: var(--uil-sun); }
  .role { font-size: 11px; letter-spacing: .14em; color: rgba(255,255,255,.85); }
  .url { font-size: 11px; letter-spacing: .1em; color: rgba(255,255,255,.5); }
  .tags { display: flex; gap: 8px; flex-wrap: wrap; }
  .tag { font-family: var(--font-mono); font-weight: 700; font-size: 10px; text-transform: uppercase; letter-spacing: .12em; color: var(--uil-water); background: var(--uil-sun); padding: 5px 9px; border-radius: 3px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="aa">Ai</div>
    <div class="stack">
      <div class="l eyebrow">Emerging Technology / 2025</div>
      <div class="l role">Stefan Martin — Full Stack Developer</div>
      <div class="l url">UILAB.COM.AU · @UILAB.AU</div>
      <div class="tags"><span class="tag">Community</span><span class="tag">Connect</span><span class="tag">Events</span></div>
    </div>
  </div>
</body>
</html>
