<!-- @dsCard group="Brand" viewport="700x210" name="Brand extensions" subtitle="Verticals lock up to the wordmark with the square-tittle gap" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; }
  .wrap { background: var(--uil-water); padding: 28px 32px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 40px; }
  .lock { display: flex; align-items: baseline; gap: 12px; }
  .mark { font-family: var(--font-display); font-weight: 700; font-size: 24px; letter-spacing: -.02em; color: var(--uil-sun); }
  .ext { font-family: var(--font-display); font-weight: 400; font-size: 24px; letter-spacing: -.01em; color: var(--uil-white); }
  .cap { font-family: var(--font-mono); font-weight: 700; font-size: 10px; text-transform: uppercase; letter-spacing: .14em; color: rgba(255,255,255,.45); margin-bottom: 16px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="cap">UiLab + vertical · Neue Montreal Regular Title Case</div>
    <div class="grid">
      <div class="lock"><span class="mark">UiLab</span><span class="ext">Community</span></div>
      <div class="lock"><span class="mark">UiLab</span><span class="ext">Connect</span></div>
      <div class="lock"><span class="mark">UiLab</span><span class="ext">Events</span></div>
      <div class="lock"><span class="mark">UiLab</span><span class="ext">Podcasts</span></div>
      <div class="lock"><span class="mark">UiLab</span><span class="ext">Industry</span></div>
    </div>
  </div>
</body>
</html>
