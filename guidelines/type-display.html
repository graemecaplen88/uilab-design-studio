<!-- @dsCard group="Type" viewport="700x250" name="Display — PP Neue Montreal" subtitle="Grotesque display & body · sentence case · tight tracking" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; }
  .wrap { background: var(--uil-water); color: var(--uil-white); padding: 28px 30px; }
  .aa { font-family: var(--font-display); font-weight: 700; font-size: 92px; line-height: .9; letter-spacing: -.03em; color: var(--uil-sun); }
  .line { font-family: var(--font-display); font-weight: 700; font-size: 30px; line-height: 1.05; letter-spacing: -.02em; margin-top: 14px; }
  .sub { font-family: var(--font-display); font-weight: 400; font-size: 16px; line-height: 1.5; color: rgba(255,255,255,.6); margin-top: 10px; max-width: 60ch; }
  .meta { font-family: var(--font-mono); font-weight: 700; font-size: 10px; text-transform: uppercase; letter-spacing: .16em; color: var(--uil-sun); margin-top: 16px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="aa">Aa</div>
    <div class="line">Translating emerging technology into local success.</div>
    <div class="sub">Light · Regular · Medium · SemiBold · Bold. Used sentence case for every headline and paragraph; tight tracking on large display sizes.</div>
    <div class="meta">Bold · Medium · Regular · Light</div>
  </div>
</body>
</html>
