<!-- @dsCard group="Colors" viewport="700x190" name="Light pops" subtitle="Vivid foregrounds — one pop per surface" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; }
  .wrap { background: #0a0a0a; padding: 24px; font-family: var(--font-mono); }
  .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .sw { border-radius: var(--radius-sm); overflow: hidden; border: 1px solid rgba(255,255,255,.1); }
  .chip { height: 84px; }
  .meta { padding: 8px 10px; background: #141414; }
  .nm { color: #fff; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .12em; }
  .hx { color: #8a8a8a; font-size: 11px; margin-top: 3px; letter-spacing: .04em; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="row">
      <div class="sw"><div class="chip" style="background:var(--uil-summer)"></div><div class="meta"><div class="nm">Summer</div><div class="hx">#FF6325</div></div></div>
      <div class="sw"><div class="chip" style="background:var(--uil-sky)"></div><div class="meta"><div class="nm">Sky</div><div class="hx">#67DAFF</div></div></div>
      <div class="sw"><div class="chip" style="background:var(--uil-sun)"></div><div class="meta"><div class="nm">Sun</div><div class="hx">#FFCD0E</div></div></div>
      <div class="sw"><div class="chip" style="background:var(--uil-jacaranda)"></div><div class="meta"><div class="nm">Jacaranda</div><div class="hx">#DD60FF</div></div></div>
      <div class="sw"><div class="chip" style="background:var(--uil-white)"></div><div class="meta"><div class="nm">White</div><div class="hx">#FFFFFF</div></div></div>
    </div>
  </div>
</body>
</html>
