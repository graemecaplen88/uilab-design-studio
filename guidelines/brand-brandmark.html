<!-- @dsCard group="Brand" viewport="700x200" name="Brandmark" subtitle="Two halves meeting in the middle — a bridge between people & systems" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; }
  .wrap { background: var(--uil-water); display: grid; grid-template-columns: repeat(4, 1fr); }
  .cell { padding: 34px 0; display: flex; align-items: center; justify-content: center; }
  .cell + .cell { border-left: 1px solid var(--border); }
  .cell img { height: 70px; width: auto; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="cell" style="background:var(--uil-water)"><img src="../assets/logos/brandmark-sun.svg" alt="UiLab brandmark sun"></div>
    <div class="cell" style="background:var(--uil-sunset)"><img src="../assets/logos/brandmark-summer.svg" alt="UiLab brandmark summer"></div>
    <div class="cell" style="background:var(--uil-land)"><img src="../assets/logos/brandmark-sky.svg" alt="UiLab brandmark sky"></div>
    <div class="cell" style="background:var(--uil-earth)"><img src="../assets/logos/brandmark-jacaranda.svg" alt="UiLab brandmark jacaranda"></div>
  </div>
</body>
</html>
