<!-- @dsCard group="Type" viewport="700x220" name="Underline — skip ink" subtitle="Sparing emphasis · stroke matches weight · breaks at descenders" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; }
  .wrap { background: var(--uil-water); color: var(--uil-white); padding: 30px; }
  .stmt { font-family: var(--font-display); font-weight: 400; font-size: 34px; line-height: 1.18; letter-spacing: -.02em; max-width: 18ch; }
  u { text-decoration-line: underline; text-decoration-thickness: 2px; text-underline-offset: 4px; text-decoration-skip-ink: auto; }
  .note { font-family: var(--font-mono); font-weight: 700; font-size: 10px; text-transform: uppercase; letter-spacing: .14em; color: var(--uil-sun); margin-top: 22px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="stmt">Translating <u>emerging technology</u> into <u>local success</u>.</div>
    <div class="note">Skip-ink breaks around g · y · p · j</div>
  </div>
</body>
</html>
